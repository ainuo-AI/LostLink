[project]
name = "lostlink-backend"
version = "0.1.0"
description = "LostLink campus lost-and-found API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "fastapi==0.116.1",
    "pydantic-settings==2.10.1",
    "pymysql[rsa]==1.1.2",
    "sqlalchemy==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
    "ruff==0.12.7",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "mysql: requires a disposable MySQL test database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
