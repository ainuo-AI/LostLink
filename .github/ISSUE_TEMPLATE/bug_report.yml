name: 缺陷报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 请提供足够信息，帮助团队复现和定位问题。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚描述实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出可以复现问题的步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 包括系统、浏览器或相关依赖版本。
